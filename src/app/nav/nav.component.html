<header *ngIf="!isHome" class="interior-header frame">
  <a routerLink="/" class="interior-brand"><img src="/assets/icon.jpg" alt="" width="40" height="40"><span>{{ 'brand.name' | t }}</span></a>
  <app-language-switch></app-language-switch>
</header>
<div class="dock">
  <a routerLink="/" class="dock-brand"><img src="/assets/icon.jpg" alt="" width="35" height="35"><span>{{ 'brand.name' | t }}</span></a>
  <nav *ngIf="isHome; else routeNav" [attr.aria-label]="'nav.chapters' | t">
    <a *ngFor="let section of sections" [href]="'#' + section.id" [class.active]="(ui.section$ | async) === section.id" [attr.aria-current]="(ui.section$ | async) === section.id ? 'location' : null" (click)="scrollTo($event, section.id)">{{ section.label | t }}</a>
  </nav>
  <ng-template #routeNav>
<nav [attr.aria-label]="'nav.main' | t">
    <a routerLink="/">{{ 'chapter.home' | t }}</a>
    <a routerLink="/book" routerLinkActive="active" ariaCurrentWhenActive="page">{{ 'nav.books' | t }}</a>
    <a routerLink="/news" routerLinkActive="active" ariaCurrentWhenActive="page">{{ 'nav.news' | t }}</a>
    <a routerLink="/bbs" routerLinkActive="active" ariaCurrentWhenActive="page">{{ 'nav.submit' | t }}</a>
  </nav>
</ng-template>
  <span class="dock-note">{{ 'footer.slogan' | t }}</span>
</div>
