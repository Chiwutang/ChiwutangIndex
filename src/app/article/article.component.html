<div class="interior-page paper-grain article-page">
<div class="article-wrap frame"><a class="back-link" routerLink="/news">← {{ 'news.back' | t }}</a>
<div class="page-state" *ngIf="!issue" role="status">
<p>{{ 'article.error' | t }}</p>
</div>
<article *ngIf="issue">
<header class="article-heading">
<p class="folio"><time [attr.datetime]="issue.date">{{ issue.date | date:'yyyy.MM.dd' }}</time><span> / {{ issue.author }}</span>
</p>
<h1>{{ issue.title }}</h1>
</header><markdown class="article-prose" [data]="issue.body"></markdown>
</article>
</div>
</div>
